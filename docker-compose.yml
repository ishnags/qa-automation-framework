# ---------------------------------------------------------------------------
# Dockerized Selenium Grid + the test runner.
#
#   selenium-hub        -> the Grid router the tests connect to
#   chrome / firefox    -> browser nodes that register with the hub
#   tests               -> our framework, running against the hub in parallel
#
# Run everything:            docker compose up --build --abort-on-container-exit
# Just the Grid (watch UI):  docker compose up selenium-hub chrome firefox
#                            then open http://localhost:4444 in a browser
# ---------------------------------------------------------------------------

services:
  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: selenium-hub
    ports:
      - "4442:4442"   # event bus (publish)
      - "4443:4443"   # event bus (subscribe)
      - "4444:4444"   # Grid endpoint / web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 10s
      retries: 10

  chrome:
    image: selenium/node-chrome:4.25.0
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2          # allow 2 parallel Chrome sessions
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    shm_size: "2gb"                      # prevents Chrome crashing on /dev/shm

  firefox:
    image: selenium/node-firefox:4.25.0
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    shm_size: "2gb"

  tests:
    build: .
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - RUN_MODE=grid
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - HEADLESS=true
      # Defaults to chrome, but CI overrides this per matrix leg (chrome/firefox)
      # so the same suite runs cross-browser on the Grid.
      - BROWSER=${BROWSER:-chrome}
      - UI_BASE_URL=https://www.saucedemo.com
      - API_BASE_URL=https://restful-booker.herokuapp.com
      - API_USERNAME=${API_USERNAME:-admin}
      - API_PASSWORD=${API_PASSWORD:-password123}
    volumes:
      # Publish Allure results + the HTML report back to the host / CI runner.
      - ./reports:/app/reports
    # Run UI + API in parallel (loadfile keeps a file's tests on one worker) and
    # emit a self-contained HTML report alongside the Allure results.
    command: pytest -n 2 --dist loadfile --reruns 1 --html=reports/html/report.html --self-contained-html
