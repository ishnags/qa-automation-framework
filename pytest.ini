[pytest]
# ---------------------------------------------------------------------------
# Central pytest configuration for the QA automation framework.
# ---------------------------------------------------------------------------

# Where tests live and how they are named.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default command-line options applied to every run.
#   -ra            : show a short summary of all non-passing tests
#   -v             : verbose test names
#   --strict-markers: fail if an unregistered marker is used (catches typos)
#   --alluredir    : write Allure result JSON into reports/allure-results
addopts =
    -ra
    -v
    --strict-markers
    --alluredir=reports/allure-results

# ---------------------------------------------------------------------------
# Markers let you slice the suite the way a real QA team does:
#   pytest -m smoke        -> quick health check
#   pytest -m regression   -> full regression pass
#   pytest -m api          -> API layer only
#   pytest -m "ui and not regression"
# ---------------------------------------------------------------------------
markers =
    smoke: fast, must-always-pass checks (login page loads, valid login works)
    regression: broader functional coverage run before a release
    functional: core happy-path user journeys (cart, checkout)
    ui: browser/Selenium tests
    api: REST API tests (requests)
    bdd: Gherkin / pytest-bdd scenarios
    negative: tests that assert the system rejects bad input
