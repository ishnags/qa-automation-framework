name: QA Automation Suite

# Run on every push and PR to main, plus a manual trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Job 1: fast smoke check on a local headless Chrome (no Grid).
  # This is the "did anything obvious break" gate.
  # -------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests (headless Chrome, local)
        env:
          RUN_MODE: local
          HEADLESS: "true"
          BROWSER: chrome
          # restful-booker uses public demo credentials, so these fall back to
          # the defaults when no repo secret is set -> CI works with zero setup.
          # For a real private API you would set these as GitHub Actions secrets.
          API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || 'password123' }}
        run: pytest -m smoke

  # -------------------------------------------------------------------------
  # Job 2: full suite in parallel against a Dockerized Selenium Grid (Chrome),
  # publishing Allure results, a rendered Allure report, and a self-contained
  # HTML report as build artifacts.
  # -------------------------------------------------------------------------
  full-suite-on-grid:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Start Selenium Grid + run the suite
        env:
          BROWSER: chrome
          # Public demo creds; fall back to defaults so no secret setup is needed.
          API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || 'password123' }}
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: Upload self-contained HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html/report.html
